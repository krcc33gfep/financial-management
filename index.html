```html
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家計簿ビューワー</title>

<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1+Code:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
  body { background: #000; color: #fff; font-family: "M PLUS 1 Code", monospace; margin:0; }
  header { display:flex; padding:10px; background:#111; align-items:center; justify-content:center; position:relative; flex-direction: column; }

  /* 🔍 検索ボックス */
  .search-wrapper {
    position: relative;
    width: 100%;
    max-width: 600px;
  }

  input[type="text"] {
    width: 100%;
    background:#222;
    color:#fff;
    border:1px solid #333;
    border-radius:6px;
    padding:8px 28px 8px 10px;
    font-size:16px;
    box-sizing: border-box;
    transition: box-shadow 0.2s ease, border-color 0.2s ease;
  }

  input[type="text"]:focus {
    outline: none;
    border-color: #0f0;
    box-shadow: 0 0 6px #0f05;
  }

  .clear-btn {
    position: absolute;
    right: 22px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: #aaa;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    display: none;
    padding: 0;
  }
  .clear-btn:hover { color: #fff; }

  .container { padding:10px; width:100%; box-sizing:border-box; }
  .row { border-bottom:1px solid #222; padding:8px 0; word-break: break-word; }

  .top-line {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
  }

  .date {
    color:#aaa;
    font-size:0.9em;
    text-align:left;
    width:30%;
  }

  .category {
    color:#ccc;
    font-size:0.9em;
    width:30%;
    text-align:center;
  }

  .classification {
    color:#ccc;
    font-size:0.9em;
    width:30%;
    text-align:right;
  }

  .bottom-line { display:flex; justify-content:flex-start; align-items:center; flex-wrap:wrap; }
  .desc { flex:1; font-size:1em; min-width:100px; }

  /* 💰 金額の色設定 */
  .amount { text-align:right; min-width:80px; font-size:1.2em; font-weight:500; }
  .amount.minus { color:#0f0; }     /* 支出（マイナス）＝緑 */
  .amount.plus  { color:#e63946; }  /* 収入（プラス） */

  #lastUpdate {
    text-align:center;
    color:#888;
    font-size:0.75em;
    margin-top:6px;
  }
</style>
</head>
<body>

<header>
  <div class="search-wrapper">
    <input id="search" type="text" placeholder="検索（例：2024年 食費 外食）...">
    <button id="clearBtn" class="clear-btn">&times;</button>
  </div>
  <div id="lastUpdate">更新情報を取得中...</div>
</header>

<div class="container" id="output"></div>

<script>
let rows = [];

const csvUrl = "https://docs.google.com/spreadsheets/d/1oJqIz1Rj614hvj-bX5A3jg3uj8Eqxgjvi5do1KYMPds/gviz/tq?tqx=out:csv";

/* 🔢 日付処理 */
function parseSlashDate(str) {
  const m = str.match(/(\d{4})\/(\d{1,2})\/(\d{1,2})/);
  if (!m) return new Date(0);
  const year = parseInt(m[1], 10);
  const month = parseInt(m[2], 10) - 1;
  const day = parseInt(m[3], 10);
  return new Date(year, month, day);
}

function formatDateDisplay(str) {
  const m = str.match(/(\d{4})\/(\d{1,2})\/(\d{1,2})/);
  if (!m) return str;
  return `${m[1]}年${parseInt(m[2],10)}月${parseInt(m[3],10)}日`;
}

/* 🧾 Google Sheets → CSV 読み込み */
fetch(csvUrl)
  .then(r => r.text())
  .then(csvText => {
    Papa.parse(csvText, {
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        rows = results.data;

        /* 🔍 検索用テキストをあらかじめ作成 */
        rows.forEach(r => {
          const dateDisplay = r['日付'] ? formatDateDisplay(r['日付']) : "";
          r._searchText = (Object.values(r).join(",") + "," + dateDisplay).toLowerCase();
        });

        rows.sort((a,b) => parseSlashDate(b['日付']) - parseSlashDate(a['日付']));
        render(rows);
      }
    });
  })
  .catch(err => console.error("CSVの読み込みに失敗:", err));

/* 🔍 検索処理 */
const search = document.getElementById("search");
const clearBtn = document.getElementById("clearBtn");

search.addEventListener("input", () => {
  const keywords = search.value.toLowerCase().trim().split(/\s+/);
  clearBtn.style.display = search.value ? "block" : "none";

  const filtered = rows.filter(r => {
    return keywords.every(kw => r._searchText.includes(kw));
  });

  render(filtered);
});

/* ❌ クリアボタン */
clearBtn.addEventListener("click", () => {
  search.value = "";
  clearBtn.style.display = "none";
  render(rows);
});

/* 🧱 レンダリング */
function render(data){
  const out = document.getElementById("output");
  out.innerHTML = "";

  const fragment = document.createDocumentFragment();

  data.forEach(r=>{
    const el = document.createElement("div");
    el.className = "row";
    const displayDate = r['日付'] ? formatDateDisplay(r['日付']) : "";
    const amount = parseFloat(r['金額']) || 0;
    const amountClass = amount > 0 ? "plus" : "minus";

    el.innerHTML = `
      <div class="top-line">
        <div class="date">${displayDate}</div>
        <div class="category">${r['カテゴリ'] || ""}</div>
        <div class="classification">${r['分類'] || ""}</div>
      </div>
      <div class="bottom-line">
        <div class="desc">${r['メモ'] || ""}</div>
        <div class="amount ${amountClass}">${r['金額'] || ""}</div>
      </div>
    `;

    fragment.appendChild(el);
  });

  out.appendChild(fragment);
}

/* ⏰ 更新日時の取得 */
const infoUrl = "https://script.google.com/macros/s/AKfycbztyxbPuL2IJYrC1b51oLnriV1Ms8n8uTdHKuyiJUNTlER3hULUxyKnNPSXjM9rxdrwaA/exec";

fetch(infoUrl)
  .then(res => res.json())
  .then(data => {
    document.getElementById("lastUpdate").textContent = `最終更新日時：${data.updated}`;
  })
  .catch(err => console.error("更新時刻の取得失敗:", err));
</script>

</body>
</html>
